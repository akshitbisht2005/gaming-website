<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gaming Store Pro</title>

<!-- PARTICLES LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<style>

/* BACKGROUND */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
}

/* PARTICLES */
#particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #0f2027;
    z-index: -1;
}

/* CONTAINER */
.container {
    padding: 50px;
}

/* WELCOME */
#welcome {
    margin-top: 100px;
}

#welcome h1 {
    font-size: 45px;
    font-weight: bold;
    color: cyan;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px cyan; }
    to { text-shadow: 0 0 25px cyan; }
}

/* INPUT */
input {
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    width: 250px;
}

/* BUTTON */
button {
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(45deg, cyan, blue);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 15px cyan;
}

/* CARDS */
.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 25px;
    margin: 20px;
    display: inline-block;
    border-radius: 20px;
    width: 220px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 0 20px cyan;
}

/* HIDDEN */
.hidden {
    display: none;
}

/* QR */
img {
    width: 220px;
    margin-top: 20px;
    border-radius: 20px;
    box-shadow: 0 0 20px cyan;
}

/* TEXT */
.subtitle {
    color: #ccc;
}

</style>
</head>

<body>

<!-- 🔥 PARTICLES BACKGROUND -->
<div id="particles-js"></div>

<!-- 🔥 WELCOME -->
<div id="welcome" class="container">
<h1>✨ Welcome to Our Gaming Store ✨</h1>
<p class="subtitle">Enter your details to continue</p>

<input id="name" placeholder="Enter Name"><br>
<input id="email" placeholder="Enter Email"><br>

<button onclick="start()">Enter Store</button>
</div>

<!-- 🔥 OPTIONS -->
<div id="options" class="container hidden">
<h1 style="color: cyan;">Select Your Power 🔥</h1>

<div class="card">
<h3>🔥 Sensi</h3>
<p>₹150</p>
<button onclick="selectOption('Sensi ₹150')">Buy</button>
</div>

<div class="card">
<h3>🎯 Aimbot</h3>
<p>₹250</p>
<button onclick="selectOption('Aimbot ₹250')">Buy</button>
</div>

<div class="card">
<h3>👁 ESP</h3>
<p>₹200</p>
<button onclick="selectOption('ESP ₹200')">Buy</button>
</div>

<div class="card">
<h3>💀 Full Pack</h3>
<p>₹500</p>
<button onclick="selectOption('Full ₹500')">Buy</button>
</div>

</div>

<!-- 🔥 PAYMENT -->
<div id="payment" class="container hidden">
<h1 style="color: cyan;">💳 Scan & Pay</h1>

<p id="info"></p>

<h3>Paytm / Google Pay / PhonePe</h3>

<img src="qr.jpg.jpg">

<h3>Upload Screenshot</h3>
<input type="file" id="proof"><br>

<button onclick="submitData()">Submit</button>
</div>

<script>

/* PARTICLES CONFIG */
particlesJS("particles-js", {
  particles: {
    number: { value: 80 },
    color: { value: "#00ffff" },
    shape: { type: "circle" },
    opacity: { value: 0.5 },
    size: { value: 3 },
    move: { speed: 3 }
  }
});

let selected = "";

/* START */
function start() {
 let name = document.getElementById("name").value;
 let email = document.getElementById("email").value;

 if(name==="" || email===""){
   alert("Enter details 😅");
   return;
 }

 document.getElementById("welcome").classList.add("hidden");
 document.getElementById("options").classList.remove("hidden");
}

/* SELECT */
function selectOption(opt){
 selected = opt;

 document.getElementById("options").classList.add("hidden");
 document.getElementById("payment").classList.remove("hidden");

 let name = document.getElementById("name").value;
 let email = document.getElementById("email").value;

 document.getElementById("info").innerHTML =
  "<b>" + name + "</b><br>" + email + "<br>" + opt;
}

/* SUBMIT */
function submitData(){
 let formData = new FormData();

 formData.append("name", document.getElementById("name").value);
 formData.append("email", document.getElementById("email").value);
 formData.append("option", selected);

 let file = document.getElementById("proof").files[0];
 formData.append("proof", file);

 fetch("/submit",{
  method:"POST",
  body:formData
 })
 .then(res=>res.text())
 .then(data=>{
   alert("🔥 Payment Submitted Successfully!");
 });
}

</script>

</body>
</html>
